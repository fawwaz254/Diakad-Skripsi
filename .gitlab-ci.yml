before_script:
    - apt-get update -qq
    - apt-get install -qq git
    - 'which ssh-agent || ( apt-get install -qq openssh-client )'
    - eval $(ssh-agent -s)
    - echo "$DEMO_PVKEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEMO_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

deploy_to_demo:
    stage: deploy
    only:
        - master
    environment: production
    script:
        - ssh -t root@$DEMO_SERVER "cd /var/www/diakademik && git pull origin master"
