version: 2.1

jobs:
  deploy-to-staging:
    machine:
      enabled: true
    steps:
      - run:
          name: Deploy To SERVER DEV
          command: |
            ssh -t $SSH_USER@$SERVER_DEV "cd /var/www/diakademik_demo && git pull origin master && php artisan migrate --force"

  deploy-to-prod:
    machine:
      enabled: true
    steps:
      - run:
          name: Deploy To SMP_YPM_1
          command: |
            ssh -t $SSH_USER@$SERVER_SMPYPM1 "cd /var/www/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMA_WH_2
          command: |
            ssh -t $SSH_USER@$SERVER_SMAWH2 "cd /var/www/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_TANADA
          command: |
            ssh -t $SSH_USER@$SERVER_SMAWH2 "cd /var/www/smktanada/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_YPM_1_
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM1 "cd /var/www/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_YPM_2
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM1 "cd /var/www/smkypm2taman/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMP_YPM_2
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM1 "cd /var/www/smpypm2sukodono/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_PEMUDA
          command: |
            ssh -t $SSH_USER@$SERVER_SMKPEMUDA "cd /var/www/smkpemudakrian/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_SITI_AMINAH
          command: |
            ssh -t $SSH_USER@$SERVER_SMKPEMUDA "cd /var/www/smksitiaminah/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_YPM_3
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM3 "cd /var/www/diakademik && git pull origin latest-release && php artisan migrate --force"
      - run:
          name: Deploy To SMK_YPM_3
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM3 "cd /var/www/diakademik && git pull origin latest-release && php artisan migrate --force"
workflows:
  # to-staging-only-master:
  #   when:
  #     or:
  #       - equal: [master, << pipeline.git.branch >>]
  #   jobs:
  #     - deploy-to-staging

  to-production:
    when:
      or:
        - equal: [latest-release, << pipeline.git.branch >>]
    jobs:
      - deploy-to-prod
