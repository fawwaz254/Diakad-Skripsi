version: 2.1

jobs:
  deploy-to-staging:
    machine:
      enabled: true
    steps:
      - run:
          name: Deploy To SERVER DEV
          command: |
            ssh -t $SSH_USER@$SERVER_DEV "cd /var/www/diakademik_demo && git pull origin master && php artisan migrate --force"

  deploy-to-smp-ypm-1:
    machine:
      enabled: true
    steps:
      - run:
          command: |
            ssh -t $SSH_USER@$SGC_1 "cd /var/www/smpypm1/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

  deploy-to-smk-ypm-2:
    machine:
      enabled: true
    steps:
      - run:
          command: |
            ssh -t $SSH_USER@$SGC_1 "cd /var/www/smkypm2/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

  deploy-to-smp-ypm-2:
