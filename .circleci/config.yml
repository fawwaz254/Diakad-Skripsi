      enabled: true
    steps:
      - run:
          command: |
            ssh -t $SSH_USER@$SGC_2 "cd /var/www/smawh2/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

  deploy-to-smk-ypm-1:
    machine:
      enabled: true
    steps:
      - run:
          command: |
            ssh -t $SSH_USER@$SGC_2 "cd /var/www/smkypm1/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

  deploy-to-smk-ypm-3:
    machine:
      enabled: true
    steps:
      - run:
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM3 "cd /var/www/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

  deploy-to-sma-maryam:
    machine:
      enabled: true
    steps:
      - run:
          command: |
            ssh -t $SSH_USER@$SERVER_SMKYPM3 "cd /var/www/smamaryamsby/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

