          command: |
            ssh -t $SSH_USER@$SGC_1 "cd /var/www/smpypm2/diakademik && git pull origin laravel-11-latest && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"

  deploy-to-sma-wh-2:
